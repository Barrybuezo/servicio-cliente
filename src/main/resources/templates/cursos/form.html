<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Nuevo Curso', ~{::div.content})}">
<body>
<div class="content">
    <div class="card shadow-sm p-4 col-md-8 offset-md-2 bg-white">
        <h3 class="mb-3">Registrar Nuevo Curso</h3>
        <form th:action="@{/cursos/guardar}" th:object="${curso}" method="post">
            <div class="mb-3">
                <label class="form-label">Código del Curso</label>
                <input type="text" th:field="*{codigo}" class="form-control" required placeholder="ej. JAVA-101"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Nombre del Curso</label>
                <input type="text" th:field="*{nombre}" class="form-control" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Modalidad</label>
                <select th:field="*{modalidad}" class="form-select" required>
                    <option value="PRESENCIAL">PRESENCIAL</option>
                    <option value="VIRTUAL">VIRTUAL</option>
                    <option value="HIBRIDA">HIBRIDA</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Cupo Máximo</label>
                <input type="number" th:field="*{cupo}" class="form-control" min="1" max="40" required/>
            </div>
            <button type="submit" class="btn btn-success">Guardar Curso</button>
            <a th:href="@{/cursos}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
