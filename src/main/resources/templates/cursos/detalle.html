<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Detalle de Curso', ~{::div.content})}">
<body>
<div class="content">
    <div class="card shadow-sm p-4 bg-white mb-4">
        <h2 th:text="${curso.nombre}"></h2>
        <p class="text-muted" th:text="'Código: ' + ${curso.codigo} + ' | Modalidad: ' + ${curso.modalidad}"></p>
        <div class="alert alert-info">
            <strong>Cupo Máximo:</strong> <span th:text="${curso.cupo}"></span> |
            <strong>Cupos Disponibles:</strong> <span class="fw-bold" th:text="${cuposDisponibles}"></span>
        </div>
    </div>

    <h4>Participantes Inscritos</h4>
    <table class="table table-bordered bg-white shadow-sm">
        <thead class="table-secondary">
        <tr>
            <th>Nombre Completo</th>
            <th>Correo</th>
            <th>Fecha Inscripción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="i : ${inscritos}">
            <td th:text="${i.participante.nombres + ' ' + i.participante.apellidos}"></td>
            <td th:text="${i.participante.correo}"></td>
            <td th:text="${i.fechaInscripcion}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(inscritos)}">
            <td colspan="3" class="text-center text-muted">No hay participantes inscritos en este curso.</td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/cursos}" class="btn btn-secondary mt-2">Volver</a>
</div>
</body>
</html>
