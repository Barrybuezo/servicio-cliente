<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Participantes', ~{::div.content})}">
<body>
<div class="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Listado de Participantes</h2>
        <a th:href="@{/participantes/nuevo}" class="btn btn-success">+ Nuevo Participante</a>
    </div>

    <table class="table table-striped bg-white shadow-sm rounded">
        <thead class="table-dark">
        <tr>
            <th>Nombres</th>
            <th>Apellidos</th>
            <th>Correo Electrónico</th>
            <th>Teléfono</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${participantes}">
            <td th:text="${p.nombres}"></td>
            <td th:text="${p.apellidos}"></td>
            <td th:text="${p.correo}"></td>
            <td th:text="${p.telefono}"></td>
            <td>
                <a th:href="@{'/participantes/eliminar/' + ${p.id}}" class="btn btn-danger btn-sm" onclick="return confirm('¿Desea eliminar este participante?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
